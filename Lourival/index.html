<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Pais!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            margin: 0;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }
        
        .foto-container {
            width: 100%;
            height: 70dvh; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px; 
            box-sizing: border-box;
            animation: deslizarTitulo 1s ease-out forwards;
        }
        
        .foto-destaque {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        
        .conteudo {
            flex: 1; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 15px 20px 15px; 
            color: white;
            text-align: center;
            box-sizing: border-box;
        }

        @keyframes deslizarTitulo {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes deslizarSubtitulo {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulsarDourado {
            0%, 100% { text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 30px rgba(255, 215, 0, 0.8); }
        }

        h1 {
            font-weight: 900;
            font-size: 1.7rem; 
            margin-bottom: 0;
            margin-top: 0;
            color: #ffffff;
            animation: deslizarTitulo 1.5s ease-out forwards;
            letter-spacing: -1px;
        }
        
        p {
            font-weight: 400;
            font-size: 0.9rem; 
            margin-top: 5px;
            margin-bottom: 10px; 
            color: #e0e0e0;
            opacity: 0;
            animation: deslizarSubtitulo 1.2s ease-out 0.8s forwards;
        }
        
        .destaque-pai {
            font-weight: 900;
            color: #FFD700;
            font-size: 1.1rem; 
            animation: pulsarDourado 2.5s infinite;
            display: block; 
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .botao-nostalgia {
            background: linear-gradient(135deg, #ff0000, #cc0000); 
            color: #ffffff;
            padding: 12px 24px; 
            font-size: 0.85rem; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            opacity: 0;
            animation: deslizarSubtitulo 1s ease-out 1.5s forwards;
            letter-spacing: 1px;
            margin-bottom: 0;
        }
        
        .botao-nostalgia:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    
    <div class="foto-container">
        <img src="foto.jpg" class="foto-destaque" alt="Foto do Dia dos Pais">
    </div>
    
    <div class="conteudo">
        <h1>Feliz Dia dos Pais!</h1>
        <p>A música perfeita para o <span class="destaque-pai">MELHOR PAI</span> do mundo!</p>
        
        <button id="btn-play" class="botao-nostalgia" onclick="tocarMusica()">▶ Dê o play na nostalgia</button>
        
        <!-- O atributo 'loop' foi adicionado aqui para repetir a música infinitamente -->
        <audio id="meu-audio" src="musica.mp3" loop></audio>
    </div>

    <script>
        function tocarMusica() {
            var audio = document.getElementById('meu-audio');
            var botao = document.getElementById('btn-play');
            var elementoDaPagina = document.documentElement; 
            
            // Inicia a música
            audio.play();
            
            // Comando para solicitar tela cheia
            if (elementoDaPagina.requestFullscreen) {
                elementoDaPagina.requestFullscreen();
            } else if (elementoDaPagina.webkitRequestFullscreen) {
                elementoDaPagina.webkitRequestFullscreen();
            } else if (elementoDaPagina.msRequestFullscreen) {
                elementoDaPagina.msRequestFullscreen();
            }
            
            // Atualiza o botão
            botao.innerText = "Tocando Agora...";
            botao.style.opacity = "0.7";
            botao.style.cursor = "default";
            botao.onclick = null; 
        }
    </script>
</body>
</html>
