<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Pais!</title>
    <style>
        body {
            background-image: url('foto.jpg');
            background-size: cover;
            background-position: center;
            background-color: #121212;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden; /* Evita que a tela crie barra de rolagem */
        }
        .pelicula-escura {
            background: rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        .conteudo {
            position: relative;
            z-index: 2;
            padding: 20px;
            color: white;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #e0e0e0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .botao-nostalgia {
            background-color: #FF0000; /* Alterado para o vermelho do YouTube */
            color: #ffffff;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            transition: transform 0.1s, opacity 0.3s;
        }
        .botao-nostalgia:active {
            transform: scale(0.95);
        }
        
        /* Esta é a caixa que vai segurar o mini-player no canto */
        #mini-player-container {
            position: fixed;
            bottom: 20px; /* Distância do fundo da tela */
            right: 20px;  /* Distância do lado direito da tela */
            z-index: 10;  /* Fica acima de tudo */
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="pelicula-escura"></div>
    
    <div class="conteudo">
        <h1>Feliz Dia dos Pais!</h1>
        <p>A melhor playlist do mundo para o MAIOR PAI do mundo!</p>
        
        <button id="btn-play" class="botao-nostalgia" onclick="tocarMusica()">▶ Dê o play na nostalgia</button>
    </div>

    <!-- Container vazio que vai receber o player quando o botão for clicado -->
    <div id="mini-player-container"></div>

    <script>
        function tocarMusica() {
            var container = document.getElementById('mini-player-container');
            var botao = document.getElementById('btn-play');
            
            // O ID da playlist que você enviou já está configurado aqui
            var playlistID = "PLpZaq7kciiNIscD5bMLUIyesR_EHTSvxu"; 
            
            // Injeta o player com um tamanho bom o suficiente para clicar em "Pular Anúncio"
            container.innerHTML = '<iframe width="250" height="140" src="https://www.youtube.com/embed/videoseries?list=' + playlistID + '&autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
            
            // Muda o visual do botão principal
            botao.innerText = "Tocando Agora...";
            botao.onclick = null; // Evita que o usuário clique de novo e carregue o player duplicado
            botao.style.opacity = "0.7";
            botao.style.cursor = "default";
        }
    </script>
</body>
</html>
