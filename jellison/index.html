<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Pais!</title>
    
    <!-- Importação da fonte moderna do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-image: url('foto.jpg');
            background-size: cover;
            background-position: center top; 
            background-color: #121212;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            /* Aqui avisamos o site para usar a nova fonte */
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        
        .pelicula-escura {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.9) 100%);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        
        .conteudo {
            position: relative;
            z-index: 2;
            padding: 30px 20px 40px 20px; 
            color: white;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- ANIMAÇÕES --- */
        @keyframes deslizarTitulo {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes deslizarSubtitulo {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulsarDourado {
            0%, 100% { text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 0 0 20px rgba(255, 215, 0, 1), 0 0 30px rgba(255, 215, 0, 0.8); }
        }

        h1 {
            font-weight: 900; /* Deixa o título bem grosso e impactante */
            font-size: 2.5rem;
            margin-bottom: 5px;
            margin-top: 0;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            animation: deslizarTitulo 1.5s ease-out forwards;
            letter-spacing: -1px; /* Junta um pouco as letras, estilo Spotify */
        }
        
        p {
            font-weight: 400; /* Texto mais fino e elegante */
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #e0e0e0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            opacity: 0;
            animation: deslizarSubtitulo 1.2s ease-out 0.8s forwards;
        }
        
        .destaque-pai {
            font-weight: 900;
            color: #FFD700;
            font-size: 1.5rem;
            animation: pulsarDourado 2.5s infinite;
            display: block; 
            margin-top: 5px;
            letter-spacing: 1px; /* Afasta um pouco as letras para dar destaque */
        }

        .botao-nostalgia {
            background: linear-gradient(135deg, #ff0000, #cc0000); 
            color: #ffffff;
            padding: 15px 32px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 0, 0, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            opacity: 0;
            animation: deslizarSubtitulo 1s ease-out 1.5s forwards;
            letter-spacing: 1px;
        }
        
        .botao-nostalgia:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.5);
        }
        
        #mini-player-container {
            display: none; 
            width: 100%;
            max-width: 320px; 
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: deslizarSubtitulo 0.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="pelicula-escura"></div>
    
    <div class="conteudo">
        <h1>Feliz Dia dos Pais!</h1>
        <p>A melhor playlist do mundo para o <span class="destaque-pai">MAIOR PAI</span> do mundo!</p>
        
        <button id="btn-play" class="botao-nostalgia" onclick="tocarMusica()">▶ Dê o play na nostalgia</button>
        
        <div id="mini-player-container"></div>
    </div>

    <script>
        function tocarMusica() {
            var container = document.getElementById('mini-player-container');
            var botao = document.getElementById('btn-play');
            
            var playlistID = "PLpZaq7kciiNIscD5bMLUIyesR_EHTSvxu"; 
            
            botao.style.display = "none";
            
            container.style.display = "block";
            container.innerHTML = '<iframe width="100%" height="130" src="https://www.youtube.com/embed/videoseries?list=' + playlistID + '&autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
        }
    </script>
</body>
</html>
