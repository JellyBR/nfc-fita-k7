<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Pais!</title>
    <style>
        body {
            background-image: url('foto.jpg');
            background-size: cover;
            background-position: center;
            background-color: #121212;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .pelicula-escura {
            background: rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        .conteudo {
            position: relative;
            z-index: 2;
            padding: 20px;
            color: white;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #e0e0e0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .botao-nostalgia {
            background-color: #1DB954; /* Pode mudar para vermelho do YouTube (#FF0000) se preferir */
            color: #121212;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
            transition: transform 0.1s;
        }
        .botao-nostalgia:active {
            transform: scale(0.95);
        }
        /* Oculta o player se quisermos só o áudio, ou deixa pequeno */
        .player-youtube iframe {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="pelicula-escura"></div>
    
    <div class="conteudo">
        <h1>Feliz Dia dos Pais!</h1>
        <p>A melhor Playlist do mundo para o Maior Pai do mundo!.</p>
        
        <!-- Esta div guarda o botão e vai ser trocada pelo player -->
        <div id="area-do-player">
            <button class="botao-nostalgia" onclick="tocarMusica()">▶ Dê o play na nostalgia</button>
        </div>
    </div>

    <script>
        function tocarMusica() {
            var area = document.getElementById('area-do-player');
            // Quando ele clica, substituímos o botão pelo vídeo rodando sozinho (autoplay=1)
            // Lembre-se de trocar o código PL... abaixo pelo ID real da sua playlist
            var playlistID = "FLB0JSO6d5ysH2Mmqz5I9rIw"; 
            
            area.innerHTML = '<div class="player-youtube"><iframe width="300" height="80" src="https://www.youtube.com/embed/videoseries?list=' + playlistID + '&autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>';
        }
    </script>
</body>
</html>
