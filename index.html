<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Fita K7</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace; /* Traz um visual mais retrô */
            text-align: center;
        }
        .botao-nostalgia {
            background-color: #1DB954; /* Verde clássico do Spotify */
            color: #121212;
            padding: 15px 35px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
            transition: transform 0.1s;
        }
        .botao-nostalgia:active {
            transform: scale(0.95);
        }
        .icone {
            font-size: 5rem;
            margin-bottom: 10px;
        }
        p {
            color: #b3b3b3;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="icone">📼</div>
    <h2>Awesome Mix Vol. 1</h2>
    <p>Prepare-se para viajar no tempo.</p>
    
    <!-- A mágica acontece aqui: O link "spotify:playlist:..." força a abertura do app -->
    <a href="spotify:playlist:37i9dQZF1DZ06evO49hLQA" class="botao-nostalgia">Dê o play na nostalgia</a>
</body>
</html>
