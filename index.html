<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Pais!</title>
    <style>
        body {
            /* Aqui a mágica acontece: a foto do pai vira o fundo da tela */
            background-image: url('foto.jpg');
            background-size: cover;
            background-position: center;
            background-color: #121212;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .pelicula-escura {
            /* Isso cria uma sombra sobre a foto para o texto dar leitura */
            background: rgba(0, 0, 0, 0.6);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        .conteudo {
            position: relative;
            z-index: 2; /* Mantém o texto e o botão acima da película escura */
            padding: 20px;
            color: white;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #e0e0e0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        .botao-nostalgia {
            background-color: #1DB954;
            color: #121212;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }
    </style>
</head>
<body>
    <div class="pelicula-escura"></div>
    
    <div class="conteudo">
        <h1>Feliz Dia dos Pais!</h1>
        <p>Um pouco de música boa para o melhor pai do mundo.</p>
        
        <!-- Substitua abaixo pelo ID da playlist correta desse pai -->
        <a href="spotify:playlist:37i9dQZF1DZ06evO49hLQA" class="botao-nostalgia">▶ Iniciar Playlist</a>
    </div>
</body>
</html>
